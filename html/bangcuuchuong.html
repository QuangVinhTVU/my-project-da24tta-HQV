<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <title>Bảng cửu chương</title>
        <meta name="viewport" content="width=device-width,initial-scale=1">
    </head>

    <body>
        <form id="formBBC">
            <label for="number">Nhập vào 1 số:</label>
            <input type="number" id="number" name="txtSo" value="2" min="0">
            <button type="submit">In bảng cửu chương</button>
        </form>

        <div id="result"></div>

        <script>
            document.getElementById('formBBC').addEventListener('submit', function(e) {
                e.preventDefault();
                const raw = document.getElementById('number').value;
                const n = parseInt(raw, 10);
                if (Number.isNaN(n)) {
                    document.getElementById('result').textContent = 'Vui lòng nhập một số hợp lệ.';
                    return;
                }
                let html = '<table border="1"><tr><th>Phép tính</th><th>Kết quả</th></tr>';
                for (let i = 1; i <= 10; i++) {
                    html += '<tr><td>' + n + ' × ' + i + '</td><td>' + (n * i) + '</td></tr>';
                }
                html += '</table>';
                document.getElementById('result').innerHTML = html;
            });
        </script>
        <a href="../index.html">Quay lại trang chủ</a>
    </body>
</html>
